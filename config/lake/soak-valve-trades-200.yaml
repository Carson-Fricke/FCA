# E6.5 trades valve config (T051): all 200 universe symbols, trade history.
# Universe: config/lake/universe-equities-200.yaml (200 liquid US listings,
# rank = list position). Decision and gates: docs/e6.4-cost-projection.md
# (QUOTE_HISTORY_VALVE); rollout record: docs/e6.5-universe-universe.md.
# Non-secret defaults only: credentials come from the environment
# (LAKE_API__BEARER_TOKEN) and the dev deployment, never from this file.
# This file must stay inside the strict YAML subset parsed by
# lake.configuration.loader.load_yaml_mapping (no anchors, no tabs, no
# secret-bearing keys).
#
# Cost prices are published Azure list prices for westus2 retrieved from the
# Azure Retail Prices API (prices.azure.com, api-version 2023-01-01-preview)
# on 2026-09-05, identical to config/lake/soak-aapl-spy.yaml. Verify prices
# again before any long soak.
