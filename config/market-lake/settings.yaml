# This file contains non-secret defaults only. Runtime credentials and the API
# bearer value must come from the environment or Key Vault.
# Numeric bounds not fixed by the task export are conservative defaults.
schema_version: 1

provider:
  name: alpaca
  request:
    # Ceiling for the adaptive per-key in-flight bound: the controller ramps
    # toward it while throughput improves and backs off when latency inflates.
    max_concurrency: 512
    # The account's Alpaca market-data budget (Algo Trader Plus: 10,000
    # requests/minute). The governor paces requests evenly against this and
    # sizes the in-flight bound by Little's law; without it the controller has
    # no budget to target and settles at its floor.
    requests_per_minute: 10000
    timeout_seconds: 30
    retry:
      max_attempts: 5
      honor_retry_after: true

storage:
  parquet:
    compression: zstd
    file_granularity: symbol_session_data_type
  capacity_bytes: 1099511627776
  pause_enqueue_at_capacity: true
  pause_ingest_at_capacity: true
  lifecycle:
    enabled: true
    cool_after_days: 14
    cold:
      # Explicit retrieval-cost decision (T065): Cold stays disabled. Enabling it
      # would add retrieval and early-deletion charges; see
      # .github/runbooks/cold-tier-policy.md before changing this value.
      enabled: false
      minimum_age_days: 365

ingest:
  backfill:
    max_replicas: 1
    order: newest_first
    liquidity_rank_tiebreaker: true
    asset_priority:
      - equity_catch_up
      - equity_backfill
      - options_backfill
      - crypto_backfill
  queue:
    visibility_timeout_seconds: 300
    visibility_renewal_seconds: 60
    max_delivery_attempts: 5
    dead_letter_on_exhaustion: true

api:
  ensure_wait_deadline_seconds: 20
  sas:
    ttl_seconds: 900
    read_only: true
    object_scoped: true
  sql:
    max_scan_bytes: 1073741824
    max_result_bytes: 33554432
    authorized_force_override_default: false
  auth:
    # Entra values arrive from the environment (LAKE_API__AUTH__ENTRA_*).
    # Without both the API enforces the static bearer token only.
    entra_tenant_id: null
    entra_audience: null
    entra_role: Lake.Access

operations:
  monthly_budget_alerts_usd:
    - 40
    - 70
  log_retention_days: 30
  daily_coverage_report: true
