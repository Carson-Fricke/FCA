# A backtest is fully event-time driven and never reads runtime credentials.
# Runnable locally with the deterministic synthetic benchmark fixture:
#   uv run backtest-job --config config/harness/backtest.yaml
schema_version: 1
shell: backtest
run_id: momentum-spy-2024-01
start: "2024-01-02T14:30:00Z"
end: "2024-01-19T21:00:00Z"
clock: event_time
event_ordering: timestamp_then_sequence_then_class_then_feed
seed: 1729
base_currency: USD
initial_cash: 100000.00
data:
  snapshot_id: market-lake-equities-2024-01-v1
  fingerprint: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
  symbols: [SPY]
  bar_interval: 1min
strategy_instances:
  -
    instance_id: spy-momentum
    implementation: strategies.harness_examples.intraday_momentum:IntradayMomentumStrategy
    bundle_hash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    capital_fraction: 1.0
    symbols: [SPY]
    parameters:
      lookback: 4
      # The synthetic fixture random-walks around 100.00 in small ticks, so a
      # 5-cent move over four quotes is a meaningful directional signal.
      threshold: "0.05"
      quantity: 20
      # The synthetic fixture spaces quotes ~32 minutes apart, so the
      # liquidation buffer must reach the final quote of each session.
      liquidation_buffer_minutes: 40
      order_prefix: mom-spy
      # The synthetic benchmark fixture runs fixed 13:30-19:30 UTC weekday
      # sessions; one close entry per session keeps the strategy flat at every
      # close. The last fixture quote lands ~32 minutes before the close, so
      # the 40-minute liquidation buffer above must reach it.
      session_close_times:
        - "2024-01-02T19:30:00Z"
        - "2024-01-03T19:30:00Z"
        - "2024-01-04T19:30:00Z"
        - "2024-01-05T19:30:00Z"
        - "2024-01-08T19:30:00Z"
        - "2024-01-09T19:30:00Z"
        - "2024-01-10T19:30:00Z"
        - "2024-01-11T19:30:00Z"
        - "2024-01-12T19:30:00Z"
        - "2024-01-15T19:30:00Z"
        - "2024-01-16T19:30:00Z"
        - "2024-01-17T19:30:00Z"
        - "2024-01-18T19:30:00Z"
        - "2024-01-19T19:30:00Z"
risk_pipeline:
  on_reject: reject_order
  rules:
    -
      rule_id: max-order-notional
      implementation: harness.risk.limits:MaxOrderNotional
      parameters:
        limit: 10000.00
    -
      rule_id: max-position-notional
      implementation: harness.risk.limits:MaxPositionNotional
      parameters:
        limit: 50000.00
fees:
  currency: USD
  rounding: half_even
  rules:
    -
      fee_id: commission
      basis: per_unit
      rate: 0.005
      minimum: 0.01
      side: both
deployment:
  name: backtest-job-local
  target: local
  environment: local
  image: null
  replicas: 1
  restart_policy: never
  network_access: disabled
  resources:
    cpu_cores: 1.0
    memory_mib: 1024
