# A backtest is fully event-time driven and never reads runtime credentials.
# Runnable locally with the native engine and a JIT-authored program:
#   cargo run -p api --bin backtest-job -- --config config/harness/backtest.yaml
schema_version: 1
shell: backtest
job_id: job-momentum-msft-2024-01
start: "2024-01-02T14:30:00Z"
end: "2024-01-04T21:00:00Z"
clock: event_time
event_ordering: timestamp_then_sequence_then_class_then_feed
seed: 1729
base_currency: USD
initial_cash: 100000.00
data:
  snapshot_id: market-lake-equities-2024-01-v1
  fingerprint: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
  symbols: [MSFT]
  subscriptions:
    - data_type: quote
      symbols: [MSFT]
strategy_instances:
  -
    instance_id: msft-momentum
    implementation: jit
    # SHA-256 of the authored source file; the JIT seam rejects a mismatch.
    bundle_hash: c65afc914778a9657c36e61e1d4e70d621f189752828849e0243dc164ab27984
    capital_fraction: 1.0
    symbols: [MSFT]
    parameters:
      lookback: 4
      quantity: 20
      # Authored Rust source, resolved relative to this configuration file.
      source_path: momentum.rs
risk_pipeline:
  on_reject: reject_order
  rules:
    -
      rule_id: max-order-notional
      implementation: harness.risk.limits:MaxOrderNotional
      parameters:
        limit: 10000.00
    -
      rule_id: max-position-notional
      implementation: harness.risk.limits:MaxPositionNotional
      parameters:
        limit: 50000.00
fees:
  currency: USD
  rounding: half_even
  rules:
    -
      fee_id: commission
      basis: per_unit
      rate: 0.005
      minimum: 0.01
      side: both
deployment:
  name: backtest-job-local
  target: local
  environment: local
  image: null
  replicas: 1
  restart_policy: never
  network_access: disabled
  resources:
    cpu_cores: 1.0
    memory_mib: 1024
