name: Prune GHCR image versions

on:
  schedule:
    # Weekly Sundays 03:00 UTC - keeps private-package storage bounded.
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  packages: write
  contents: read

concurrency:
  group: prune-ghcr
  cancel-in-progress: false

jobs:
  prune:
    name: Delete old image versions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out retention tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify retention policy
        run: node --test scripts/ci/acr-retention.test.mjs
      - name: Prune image versions (keep newest 10, never delete < 7 days)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # owner/name -> package name (stripped + lowercased below). Event
          # payload independent, so schedule and workflow_dispatch agree.
          PACKAGE_NAME: ${{ github.repository }}
          KEEP_NEWEST: '10'
          # Spec floor (T212 AC2): the 7-day floor preserves the Azure rollback
          # window. GHCR versions are NOT rebuildable: deleting one removes the
          # manifest and its SHA tag, and deploy-main re-imports rollbacks from
          # GHCR by digest (ghcr.io/<owner>/<repo>@<digest>).
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          MIN_AGE_DAYS: '7'
        run: |
          set -euo pipefail

          # GHCR package names are lowercase and bare (no owner prefix).
          PACKAGE_NAME="${PACKAGE_NAME##*/}"
          PACKAGE_NAME="${PACKAGE_NAME,,}"

          # BuildKit cache manifests live in a separate package so they cannot
          # evict Cargo caches. Retain moving cache tags and bound old untagged
          # versions with the same rollback window as published runtime images.
          case "$OWNER_TYPE" in
            User) owner_path="users/${GITHUB_REPOSITORY_OWNER}" ;;
            Organization) owner_path="orgs/${GITHUB_REPOSITORY_OWNER}" ;;
            *) echo "::error::Unknown package owner type"; exit 1 ;;
          esac
          package_names=("$PACKAGE_NAME" "${PACKAGE_NAME}-ingestion" "${PACKAGE_NAME}-buildcache")
          for PACKAGE_NAME in "${package_names[@]}"; do

          # Collect every version id + created_at (paginated). mktemp -d for a
          # scratch DIRECTORY (plain mktemp yields a file, not a directory).
          page=1
          tmp="$(mktemp -d)"
          while :; do
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/${owner_path}/packages/container/${PACKAGE_NAME}/versions?per_page=100&page=${page}" \
              > "$tmp/page-$page.json"
            count="$(node -e "console.log(JSON.parse(require('fs').readFileSync('$tmp/page-$page.json','utf8')).length)")"
            if [[ "$count" -eq 0 ]]; then
              break
            fi
            page=$((page + 1))
            if [[ "$page" -gt 30 ]]; then
              echo "::error::Version listing exceeded 30 pages; aborting to stay bounded"
              exit 1
            fi
          done

          PACKAGE_NAME="$PACKAGE_NAME" node scripts/ci/ghcr-retention.mjs "$tmp"

          total="$(node -e "console.log(JSON.parse(require('fs').readFileSync('$tmp/stats.json','utf8')).total)")"
          delete_count="$(node -e "console.log(JSON.parse(require('fs').readFileSync('$tmp/delete-ids.json','utf8')).length)")"
          echo "Surveyed ${total} image version(s); deleting ${delete_count}"

          deleted=0
          for id in $(node -e "JSON.parse(require('fs').readFileSync('$tmp/delete-ids.json','utf8')).forEach((id)=>console.log(id))"); do
            if gh api -X DELETE \
              -H "Accept: application/vnd.github+json" \
              "/${owner_path}/packages/container/${PACKAGE_NAME}/versions/${id}"; then
              deleted=$((deleted + 1))
            else
              echo "::warning::Failed to delete version ${id} (continuing)"
            fi
          done

          echo "::notice::GHCR prune complete: surveyed ${total} version(s); deleted ${deleted}/${delete_count}; newest ${KEEP_NEWEST} image roots, moving tags, grace-window versions and their manifest children retained"
          rm -rf "$tmp"
          done
