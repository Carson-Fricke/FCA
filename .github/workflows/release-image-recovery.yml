name: Recover exact published image graphs

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev
    concurrency:
      group: fca-deployment-dev
      cancel-in-progress: false
      queue: max
    steps:
      - name: Sign in to Azure with OIDC
        uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Restore current published descriptors without changing runtime pins
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          restore_graph() {
            local source="$1" repository="$2" digest="$3"
            local children
            children="$(az acr manifest show-metadata --registry fcau7enxjst4w72u --name "${repository}@${digest}" --query 'references[].digest' --output tsv)"
            for child in $children; do
              az acr import --name fcau7enxjst4w72u --source "ghcr.io/carson-fricke/${source}@${child}" --repository "$repository" --username "$GITHUB_ACTOR" --password "$GHCR_TOKEN" --force --only-show-errors --output none
            done
            az acr import --name fcau7enxjst4w72u --source "ghcr.io/carson-fricke/${source}@${digest}" --repository "$repository" --username "$GITHUB_ACTOR" --password "$GHCR_TOKEN" --force --only-show-errors --output none
          }
          restore_graph fca fca-harness sha256:a6f996b2bb8c32fd8e2da5722055febc867fabfb830eff254a252a22f090f199
          restore_graph fca-ingestion fca-ingestion sha256:b76e43c4e20f13f093dd4c67d6e44f0e39df3b98a9b443d399c146a39713879d
          restore_graph fca-thesis fca-thesis sha256:07a3e189c3421142e1878cc0659ff4f45dc9a5e406b6c2199e4db963d5b3b36f
