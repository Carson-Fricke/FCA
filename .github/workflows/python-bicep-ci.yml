name: Python, Rust, and Bicep CI

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/ci/**"
      - "**/*.py"
      - "config/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "src/harness/**"
      - "src/lake/**"
      - "src/ui/**"
      - "Dockerfile"
      - "Dockerfile.thesis"
      - ".dockerignore"
      - "infra/**"
  push:
    branches:
      - master
      - main
    paths:
      - ".github/workflows/**"
      - "scripts/ci/**"
      - "**/*.py"
      - "config/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "src/harness/**"
      - "src/lake/**"
      - "src/ui/**"
      - "Dockerfile"
      - "Dockerfile.thesis"
      - ".dockerignore"
      - "infra/**"

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select affected verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.changes.outputs.python }}
      harness: ${{ steps.changes.outputs.harness }}
      lake: ${{ steps.changes.outputs.lake }}
      bicep: ${{ steps.changes.outputs.bicep }}
      ui: ${{ steps.changes.outputs.ui }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify input selection
        run: node --test scripts/ci/changes.test.mjs
      - name: Select changed products
        id: changes
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHANGE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CHANGE_EVENT: ${{ github.event_name }}
        run: node scripts/ci/changes.mjs

  python:
    name: Python quality, tests, and package build
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba # v6.3.1
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal

      - name: Verify lockfile
        run: uv lock --check

      - name: Sync locked development environment
        run: uv sync --locked --extra dev

      - name: Ruff lint
        run: uv run --extra dev ruff check .

      - name: Ruff format check
        run: uv run --extra dev ruff format --check .

      - name: ty type check
        run: uv run --extra dev ty check

      - name: Run tests
        run: uv run --extra dev pytest -p no:cacheprovider --durations=25

      - name: Build package
        run: uv build --python 3.12 --wheel --force-pep517 --out-dir dist-ci --clear --no-create-gitignore .

      - name: Verify installed SDK outside the checkout
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes --format requirements-txt --output-file dist-ci/requirements.txt
          uv run --python 3.12 --isolated --no-project --with-requirements dist-ci/requirements.txt --with ./dist-ci/fca-0.1.0-py3-none-any.whl python -I scripts/ci/installed_sdk_smoke.py

  rust:
    name: Rust format, lint, and tests
    needs: changes
    if: needs.changes.outputs.harness == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: src/harness
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup show

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src/harness -> target
          shared-key: harness-ci
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Check harness formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --locked

  lake-rust:
    name: Market-lake Rust format, lint, and tests
    needs: changes
    if: needs.changes.outputs.lake == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: src/lake
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup show

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src/lake -> target
          shared-key: lake-ci
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --locked

  bicep:
    name: Bicep validation
    needs: changes
    if: needs.changes.outputs.bicep == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build Bicep composition
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

      - name: Lint Bicep composition
        run: az bicep lint --file infra/main.bicep

  ui:
    name: UI quality, tests, and build
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/ui
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/ui/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
