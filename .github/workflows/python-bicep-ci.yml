name: Python, Rust, and Bicep CI

on:
  pull_request:
    paths:
      - ".github/workflows/python-bicep-ci.yml"
      - ".github/workflows/deploy-thesis.yml"
      - "scripts/ci/**"
      - "**/*.py"
      - "config/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "src/harness/**"
      - "src/lake/**"
      - "src/ui/**"
      - "Dockerfile"
      - ".dockerignore"
      - "infra/**"
  push:
    branches:
      - master
      - main
    paths:
      - ".github/workflows/python-bicep-ci.yml"
      - ".github/workflows/deploy-thesis.yml"
      - "scripts/ci/**"
      - "**/*.py"
      - "config/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "src/harness/**"
      - "src/lake/**"
      - "src/ui/**"
      - "Dockerfile"
      - ".dockerignore"
      - "infra/**"

permissions:
  contents: read

jobs:
  python:
    name: Python quality, tests, and package build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba # v6.3.1
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install pinned Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Verify lockfile
        run: uv lock --check

      - name: Sync locked development environment
        run: uv sync --locked --extra dev

      - name: Ruff lint
        run: uv run --extra dev ruff check .

      - name: Ruff format check
        run: uv run --extra dev ruff format --check .

      - name: ty type check
        run: uv run --extra dev ty check

      - name: Run tests
        run: uv run --extra dev pytest -p no:cacheprovider --durations=25

      - name: Build package
        run: uv build --python 3.12 --wheel --force-pep517 --out-dir dist-ci --clear --no-create-gitignore .

      - name: Verify installed SDK outside the checkout
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes --format requirements-txt --output-file dist-ci/requirements.txt
          uv run --python 3.12 --isolated --no-project --with-requirements dist-ci/requirements.txt --with ./dist-ci/fca-0.1.0-py3-none-any.whl python -I scripts/ci/installed_sdk_smoke.py

  rust:
    name: Rust format, lint, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: src/harness
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup show

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --locked

  lake-rust:
    name: Market-lake Rust format, lint, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: src/lake
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup show

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --locked

  bicep:
    name: Bicep validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build Bicep composition
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

      - name: Lint Bicep composition
        run: az bicep lint --file infra/main.bicep
