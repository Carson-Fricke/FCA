name: Python and Bicep CI

on:
  pull_request:
    paths:
      - ".github/workflows/python-bicep-ci.yml"
      - "**/*.py"
      - "config/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "setup.py"
      - "src/harness/**"
      - "Dockerfile"
      - ".dockerignore"
      - "infra/**"
  push:
    branches:
      - master
      - main
    paths:
      - ".github/workflows/python-bicep-ci.yml"
      - "**/*.py"
      - "config/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "setup.py"
      - "src/harness/**"
      - "Dockerfile"
      - ".dockerignore"
      - "infra/**"

permissions:
  contents: read

jobs:
  python:
    name: Python quality, tests, and package build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba # v6.3.1
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Verify lockfile
        run: uv lock --check

      - name: Sync locked development environment
        run: uv sync --locked --extra dev

      - name: Ruff lint
        run: uv run --extra dev ruff check .

      - name: Ruff format check
        run: uv run --extra dev ruff format --check .

      - name: Strategy sandbox lint sweep
        run: |
          uv run --extra dev python -c "from harness.strategy.lint import lint_strategy_directory; report = lint_strategy_directory('strategies'); print(report.render()); report.raise_for_status()"

      - name: ty type check
        run: uv run --extra dev ty check

      - name: Run tests
        run: uv run --extra dev pytest -p no:cacheprovider

      - name: Build package
        run: uv build --python 3.12 --wheel --force-pep517 --out-dir dist-ci --clear --no-create-gitignore .

  rust:
    name: Rust format, lint, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: src/harness
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup show

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --locked

  parity:
    name: Cross-language parity oracle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba # v6.3.1
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Build Rust native core
        run: cargo build --locked -p native --manifest-path src/harness/Cargo.toml

      - name: Sync locked development environment
        run: uv sync --locked --extra dev

      - name: Rust-core determinism oracle
        run: >-
          uv run --extra dev pytest -p no:cacheprovider
          tests/determinism/test_rust_oracle.py

  bicep:
    name: Bicep validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build Bicep composition
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

      - name: Lint Bicep composition
        run: az bicep lint --file infra/main.bicep
