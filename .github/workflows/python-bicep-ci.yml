name: Python and Bicep CI

on:
  pull_request:
    paths:
      - ".github/workflows/python-bicep-ci.yml"
      - "**/*.py"
      - "config/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "infra/**"
  push:
    branches:
      - master
      - main
    paths:
      - ".github/workflows/python-bicep-ci.yml"
      - "**/*.py"
      - "config/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "infra/**"

permissions:
  contents: read

jobs:
  python:
    name: Python quality, tests, and package build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba # v6.3.1
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Verify lockfile
        run: uv lock --check

      - name: Sync locked development environment
        run: uv sync --locked --extra dev

      - name: Ruff lint
        run: uv run --extra dev ruff check .

      - name: Ruff format check
        run: uv run --extra dev ruff format --check .

      - name: ty type check
        run: uv run --extra dev ty check

      - name: Run tests
        run: uv run --extra dev pytest -p no:cacheprovider

      - name: Build package
        run: uv build --python 3.12 --wheel --force-pep517 --out-dir dist-ci --clear --no-create-gitignore .

  bicep:
    name: Bicep validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build Bicep composition
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

      - name: Lint Bicep composition
        run: az bicep lint --file infra/main.bicep
