name: Publish container image

on:
  push:
    branches:
      - image-build
  workflow_call:
    outputs:
      ingestion-digest:
        description: Finite ingestion Job image digest
        value: ${{ jobs.publish.outputs.ingestion-digest }}
      image-reference:
        description: Immutable GHCR image reference
        value: ${{ jobs.publish.outputs.image-reference }}
      image-digest:
        description: Published image digest
        value: ${{ jobs.publish.outputs.image-digest }}
      image-tag:
        description: Full commit SHA image tag
        value: ${{ jobs.publish.outputs.image-tag }}

jobs:
  publish:
    name: Build and publish shared image
    concurrency:
      group: image-build-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # Dependency-graph changes can require a cold Rust cook and cache export.
    # The harness cook owns the bundled DuckDB build; the finite lake targets
    # omit it. Source-only changes reuse these registry-backed dependency layers.
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      ingestion-digest: ${{ steps.ingestion.outputs.digest }}
      image-reference: ${{ format('{0}@{1}', steps.image.outputs.name, steps.build.outputs.digest) }}
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.image.outputs.tag }}
    steps:
      - name: Check out source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve image name and tag
        id: image
        shell: bash
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf 'name=%s\n' "$image_name" >> "$GITHUB_OUTPUT"
          printf 'tag=%s:%s\n' "$image_name" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Authenticate to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish shared image
        id: build
        uses: docker/build-push-action@ee4ca427a2f43b6a16632044ca514c076267da23 # v6.19.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tag }}
          # Keep large Rust/BuildKit layers outside the Actions cache quota.
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}-buildcache:harness
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}-buildcache:harness,mode=max,image-manifest=true,oci-mediatypes=true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and publish finite ingestion image
        id: ingestion
        uses: docker/build-push-action@ee4ca427a2f43b6a16632044ca514c076267da23
        with:
          context: .
          file: Dockerfile
          target: ingestion-runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}-ingestion:${{ github.sha }}
          cache-from: |
            type=registry,ref=${{ steps.image.outputs.name }}-buildcache:harness
            type=registry,ref=${{ steps.image.outputs.name }}-buildcache:ingestion
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}-buildcache:ingestion,mode=max,image-manifest=true,oci-mediatypes=true
