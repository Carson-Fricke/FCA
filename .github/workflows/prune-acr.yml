name: Prune ACR image retention

on:
  schedule:
    # Weekly Sundays 04:00 UTC - one hour after the GHCR prune, so the private
    # mirror is reconciled after its upstream source is bounded.
    - cron: '0 4 * * 0'
  workflow_call:
    inputs:
      image-digest:
        description: >-
          Optional sha256 digest (sha256:<64 hex>) of the image just deployed.
          It is retained regardless of its position in the manifest survey.
        required: false
        type: string
        default: ''
      repository-name:
        description: >-
          ACR repository name inside the private registry. Empty derives the
          lowercased GitHub repository name, matching the deploy import.
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      image-digest:
        description: >-
          Optional sha256 digest (sha256:<64 hex>) to retain regardless of age
          or survey position; empty keeps only the standard retention set.
        required: false
        type: string
        default: ''
      repository-name:
        description: >-
          ACR repository name inside the private registry. Empty derives the
          lowercased GitHub repository name, matching the deploy import.
        required: false
        type: string
        default: ''

concurrency:
  group: fca-acr-prune-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prune:
    name: Delete unretained mirrored digests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The prune deletes only private ACR manifests; it never touches the GHCR
    # source and reads Container Apps revision data read-only, so the OIDC
    # identity posture matches the deploy and smoke workflows.
    environment:
      name: ${{ vars.DEPLOYMENT_ENVIRONMENT }}
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_DIGEST: ${{ inputs.image-digest }}
      REPOSITORY_NAME_INPUT: ${{ inputs.repository-name }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      RESOURCE_NAME_PREFIX: ${{ vars.RESOURCE_NAME_PREFIX }}
      DEPLOYMENT_ENVIRONMENT: ${{ vars.DEPLOYMENT_ENVIRONMENT }}
      ENABLE_CRYPTO_TRADER: ${{ vars.ENABLE_CRYPTO_TRADER }}
      # Spec (T208): each service keeps the latest and previous mirrored image.
      KEEP_NEWEST: '2'
      # The ACR data plane serves one bounded manifest page per request, so the
      # survey can never observe an unbounded set, and only surveyed manifests
      # are ever deleted.
      SURVEY_WINDOW: '100'
      MAX_DELETIONS: '100'

    steps:
      - name: Validate prune inputs
        shell: bash
        run: |
          set -euo pipefail

          required=(
            AZURE_CLIENT_ID
            AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID
            AZURE_RESOURCE_GROUP
            RESOURCE_NAME_PREFIX
            DEPLOYMENT_ENVIRONMENT
            ENABLE_CRYPTO_TRADER
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required prune input $name is empty"
              exit 1
            fi
          done

          for boolean in ENABLE_CRYPTO_TRADER; do
            case "${!boolean,,}" in
              true|false) ;;
              *)
                echo "::error::$boolean must be exactly true or false"
                exit 1
                ;;
            esac
          done

          if [[ -n "$IMAGE_DIGEST" && ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The image-digest input must be empty or a sha256:<64 hex> digest"
            exit 1
          fi

      - name: Sign in to Azure with OIDC
        uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Prune mirrored digests (keep newest two plus revision references)
        shell: bash
        run: |
          set -euo pipefail

          # The deploy import names the ACR repository after the lowercased
          # GitHub repository name (deploy-main.yml: az acr import --image
          # "${mirror_repository}:${GITHUB_SHA}"), so the empty input derives
          # exactly that name.
          repository_name="${REPOSITORY_NAME_INPUT,,}"
          if [[ -z "$repository_name" ]]; then
            repository_name="${GITHUB_REPOSITORY##*/}"
            repository_name="${repository_name,,}"
          fi
          if [[ ! "$repository_name" =~ ^[a-z0-9][a-z0-9._/-]*$ ]]; then
            echo "::error::The ACR repository name '$repository_name' is not a valid repository name"
            exit 1
          fi

          acr_name="$(az acr list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[?tags.product=='market-lake' && tags.environment=='${DEPLOYMENT_ENVIRONMENT}'].name | [0]" \
            --output tsv)"
          if [[ -z "$acr_name" ]]; then
            echo "::error::The private runtime ACR is missing; rerun the authorized OIDC bootstrap"
            exit 1
          fi
          acr_login_server="$(az acr show \
            --name "$acr_name" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query loginServer \
            --output tsv)"

          tmp="$(mktemp -d)"
          : > "$tmp/references.raw"

          # Only digest references pointing at this service repository in this
          # registry are surveyed. Any other image reference belongs to a
          # non-service repository this workflow must never touch.
          extract_digest() {
            local image="$1"
            local prefix="${acr_login_server}/${repository_name}@"
            case "$image" in
              "$prefix"sha256:*)
                printf '%s\n' "${image#"${prefix}"}" >> "$tmp/references.raw"
                ;;
            esac
          }

          # A revision protects its image while it is active or still receives
          # traffic (a rollback candidate); inactive zero-traffic revisions do
          # not pin anything.
          read_revision_references() {
            local app_name="$1"
            local revisions
            if ! revisions="$(az containerapp revision list \
              --name "$app_name" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --output json \
              2>/dev/null)"; then
              echo "::warning::Could not read revisions of $app_name; its referenced digests were not surveyed"
              return 0
            fi
            jq --raw-output \
              '.[]
                | select((.properties.active == true) or ((.properties.trafficWeight // 0) > 0))
                | .properties.template.containers[]
                | .image' \
              <<<"$revisions" \
              | while IFS= read -r image; do
                  if [[ -n "$image" ]]; then
                    extract_digest "$image"
                  fi
                done
          }

          normalized_prefix="${RESOURCE_NAME_PREFIX,,}"
          normalized_environment="${DEPLOYMENT_ENVIRONMENT,,}"
          app_names=(
            "${normalized_prefix}-${normalized_environment}-api"
            "${normalized_prefix}-${normalized_environment}-quant-api"
            "${normalized_prefix}-${normalized_environment}-rth-trader"
          )
          if [[ "${ENABLE_CRYPTO_TRADER,,}" == "true" ]]; then
            app_names+=("${normalized_prefix}-${normalized_environment}-crypto-trader")
          fi
          for app_name in "${app_names[@]}"; do
            read_revision_references "$app_name"
          done

          # Container Apps jobs have no revisions; their template image is the
          # live reference, so it protects its digest the same way.
          for job_name in "${normalized_prefix}-${normalized_environment}-ingest" \
            "${normalized_prefix}-${normalized_environment}-backtest"; do
            if job_images="$(az containerapp job show \
              --name "$job_name" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "properties.template.containers[].image" \
              --output tsv \
              2>/dev/null)"; then
              while IFS= read -r image; do
                if [[ -n "$image" ]]; then
                  extract_digest "$image"
                fi
              done <<<"$job_images"
            else
              echo "::warning::Could not read job $job_name; its referenced digest was not surveyed"
            fi
          done

          az acr manifest list-metadata \
            --name "$acr_name" \
            --repository "$repository_name" \
            --only-show-errors \
            --output json > "$tmp/manifests.json"

          node -e '
            const fs = require("fs");
            const tmp = process.argv[1];
            const manifests = JSON.parse(fs.readFileSync(tmp + "/manifests.json", "utf8"));
            const references = new Set(
              fs.readFileSync(tmp + "/references.raw", "utf8").split("\n").filter(Boolean)
            );
            const keepNewest = Number(process.env.KEEP_NEWEST);
            const deployedDigest = process.env.IMAGE_DIGEST || "";
            const rows = manifests
              .map((m) => ({
                digest: m.digest,
                created: Date.parse(m.timestamp ?? m.createdTime ?? m.createTime ?? ""),
                tags: Array.isArray(m.tags) ? m.tags : [],
              }))
              .filter((r) => Boolean(r.digest));
            if (rows.length > 0 &&
                rows.some((r) => !/^sha256:[0-9a-f]{64}$/.test(r.digest) || Number.isNaN(r.created))) {
              console.error("::error::The manifest listing returned an entry without a digest or parseable creation time; aborting rather than guessing");
              process.exit(1);
            }
            rows.sort((a, b) => b.created - a.created);
            const keep = new Set();
            rows.slice(0, keepNewest).forEach((r) => keep.add(r.digest));
            if (deployedDigest) keep.add(deployedDigest);
            references.forEach((d) => keep.add(d));
            rows
              .filter((r) => r.tags.some((t) => !/^[0-9a-f]{40}$/.test(t)))
              .forEach((r) => keep.add(r.digest));
            const deletions = rows.filter((r) => !keep.has(r.digest)).map((r) => r.digest);
            const keptCount = rows.filter((r) => keep.has(r.digest)).length;
            if (deployedDigest) {
              const rank = rows.findIndex((r) => r.digest === deployedDigest);
              if (rank >= keepNewest) {
                console.log(`::warning::The deployed digest ranked ${rank + 1} in the survey; the listing order may not be newest-first (it is retained explicitly regardless)`);
              }
            }
            fs.writeFileSync(tmp + "/delete-digests.json", JSON.stringify(deletions));
            fs.writeFileSync(tmp + "/stats.json", JSON.stringify({ total: rows.length, kept: keptCount, deleting: deletions.length }));
          ' "$tmp"

          total="$(node -e "console.log(JSON.parse(require('fs').readFileSync('$tmp/stats.json','utf8')).total)")"
          kept="$(node -e "console.log(JSON.parse(require('fs').readFileSync('$tmp/stats.json','utf8')).kept)")"
          delete_count="$(node -e "console.log(JSON.parse(require('fs').readFileSync('$tmp/stats.json','utf8')).deleting)")"
          echo "Surveyed ${total} mirrored manifest(s) in ${repository_name}; keeping ${kept}; deleting ${delete_count}"
          if (( total >= SURVEY_WINDOW )); then
            echo "::warning::The survey hit the ${SURVEY_WINDOW}-manifest service page cap; older manifests beyond it remain for later runs"
          fi
          if (( delete_count > MAX_DELETIONS )); then
            echo "::error::The delete list exceeded the bounded ${MAX_DELETIONS}-manifest cap; aborting to stay bounded"
            exit 1
          fi

          deleted=0
          for digest in $(node -e "JSON.parse(require('fs').readFileSync('$tmp/delete-digests.json','utf8')).forEach((d)=>console.log(d))"); do
            if az acr repository delete \
              --name "$acr_name" \
              --image "${repository_name}@${digest}" \
              --yes \
              --only-show-errors \
              --output none; then
              deleted=$((deleted + 1))
            else
              echo "::warning::Failed to delete manifest ${digest} (continuing)"
            fi
          done

          echo "::notice::ACR prune complete: surveyed ${total} mirrored manifest(s) in ${repository_name}; deleted ${deleted}/${delete_count}; newest ${KEEP_NEWEST}, revision-referenced, tagged, and deployed digests retained"
          {
            echo "### ACR image retention"
            echo "- Registry: \\`$acr_name\\` ($acr_login_server)"
            echo "- Repository: \\`$repository_name\\`"
            echo "- Surveyed: \\`$total\\` mirrored manifest(s)"
            echo "- Kept: \\`$kept\\` (newest ${KEEP_NEWEST} + revision references + tagged + deployed)"
            echo "- Deleted: \\`$deleted\\` of \\`$delete_count\\` candidates"
          } >> "$GITHUB_STEP_SUMMARY"
          rm -rf "$tmp"
