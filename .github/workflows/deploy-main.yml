name: Deploy main environment

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/deploy-main.yml
      - .github/workflows/publish-image.yml
      - .github/workflows/quant-smoke.yml
      - .github/workflows/prune-acr.yml
      - Dockerfile
      # The image build context allowlist shapes what the Docker build sees,
      # so a .dockerignore change must redeploy.
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - config/**
      - infra/**
      - src/**

concurrency:
  group: fca-main-deployment-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-image:
    name: Publish immutable image
    uses: ./.github/workflows/publish-image.yml
    permissions:
      contents: read
      packages: write

  deploy:
    name: Deploy and smoke test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: publish-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Environment protection and branch policy are evaluated before this job.
    # This is the only repository-managed production mutation path.
    environment:
      name: ${{ vars.DEPLOYMENT_ENVIRONMENT }}
    permissions:
      contents: read
      id-token: write
      packages: read
    env:
      IMAGE_REFERENCE: ${{ needs.publish-image.outputs.image-reference }}
      IMAGE_DIGEST: ${{ needs.publish-image.outputs.image-digest }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      RESOURCE_NAME_PREFIX: ${{ vars.RESOURCE_NAME_PREFIX }}
      DEPLOYMENT_ENVIRONMENT: ${{ vars.DEPLOYMENT_ENVIRONMENT }}
      BUDGET_START_DATE: ${{ vars.BUDGET_START_DATE }}
      ALLOW_PUBLIC_NETWORK_ACCESS: ${{ vars.ALLOW_PUBLIC_NETWORK_ACCESS }}
      ENABLE_EXTERNAL_API_INGRESS: ${{ vars.ENABLE_EXTERNAL_API_INGRESS }}
      INGEST_CRON_EXPRESSION: ${{ vars.INGEST_CRON_EXPRESSION }}
      INGEST_REPLICA_TIMEOUT_SECONDS: ${{ vars.INGEST_REPLICA_TIMEOUT_SECONDS }}
      ENABLE_CRYPTO_TRADER: ${{ vars.ENABLE_CRYPTO_TRADER }}
      RTH_TRADER_CREDENTIAL_MODE: ${{ vars.RTH_TRADER_CREDENTIAL_MODE }}
      CRYPTO_TRADER_CREDENTIAL_MODE: ${{ vars.CRYPTO_TRADER_CREDENTIAL_MODE }}
      RTH_SCHEDULE_TIMEZONE: ${{ vars.RTH_SCHEDULE_TIMEZONE }}
      RTH_SCHEDULE_START: ${{ vars.RTH_SCHEDULE_START }}
      RTH_SCHEDULE_END: ${{ vars.RTH_SCHEDULE_END }}
      RTH_TRADER_REPLICAS: ${{ vars.RTH_TRADER_REPLICAS }}
      BACKTEST_REPLICA_TIMEOUT_SECONDS: ${{ vars.BACKTEST_REPLICA_TIMEOUT_SECONDS }}
      LAKE_API_AUDIENCE: ${{ vars.LAKE_API_AUDIENCE }}
      GITHUB_OWNER: ${{ github.event.repository.owner.login }}
      GITHUB_OWNER_ID: ${{ github.event.repository.owner.id }}
      GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
      GITHUB_REPOSITORY_ID: ${{ github.event.repository.id }}

    steps:
      - name: Check out source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate deployment inputs
        shell: bash
        env:
          BUDGET_ALERT_CONTACT_EMAIL: ${{ secrets.BUDGET_ALERT_CONTACT_EMAIL }}
        run: |
          set -euo pipefail

          required=(
            IMAGE_REFERENCE
            IMAGE_DIGEST
            AZURE_CLIENT_ID
            AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID
            AZURE_RESOURCE_GROUP
            AZURE_LOCATION
            RESOURCE_NAME_PREFIX
            DEPLOYMENT_ENVIRONMENT
            BUDGET_START_DATE
            BUDGET_ALERT_CONTACT_EMAIL
            ALLOW_PUBLIC_NETWORK_ACCESS
            ENABLE_EXTERNAL_API_INGRESS
            INGEST_CRON_EXPRESSION
            INGEST_REPLICA_TIMEOUT_SECONDS
            ENABLE_CRYPTO_TRADER
            RTH_TRADER_CREDENTIAL_MODE
            CRYPTO_TRADER_CREDENTIAL_MODE
            RTH_SCHEDULE_TIMEZONE
            RTH_SCHEDULE_START
            RTH_SCHEDULE_END
            RTH_TRADER_REPLICAS
            BACKTEST_REPLICA_TIMEOUT_SECONDS
            GITHUB_OWNER
            GITHUB_OWNER_ID
            GITHUB_REPOSITORY_NAME
            GITHUB_REPOSITORY_ID
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required deployment input $name is empty"
              exit 1
            fi
          done

          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The image job did not return a valid immutable digest"
            exit 1
          fi
          if [[ ! "$IMAGE_REFERENCE" =~ ^ghcr\.io/[^@[:space:]]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The image job did not return a digest-addressed GHCR reference"
            exit 1
          fi
          if [[ "$IMAGE_REFERENCE" != *@$IMAGE_DIGEST ]]; then
            echo "::error::The image reference and image digest outputs disagree"
            exit 1
          fi

          for boolean in ALLOW_PUBLIC_NETWORK_ACCESS ENABLE_EXTERNAL_API_INGRESS ENABLE_CRYPTO_TRADER; do
            case "${!boolean,,}" in
              true|false) ;;
              *)
                echo "::error::$boolean must be exactly true or false"
                exit 1
                ;;
            esac
          done

          for mode in RTH_TRADER_CREDENTIAL_MODE CRYPTO_TRADER_CREDENTIAL_MODE; do
            case "${!mode,,}" in
              paper|live) ;;
              *)
                echo "::error::$mode must be exactly paper or live"
                exit 1
                ;;
            esac
          done

          if ! [[ "$RTH_TRADER_REPLICAS" =~ ^[1-4]$ ]]; then
            echo "::error::RTH_TRADER_REPLICAS must be an integer between 1 and 4"
            exit 1
          fi
          if ! [[ "$BACKTEST_REPLICA_TIMEOUT_SECONDS" =~ ^[0-9]+$ ]] || \
             [[ "$BACKTEST_REPLICA_TIMEOUT_SECONDS" -lt 60 || "$BACKTEST_REPLICA_TIMEOUT_SECONDS" -gt 86400 ]]; then
            echo "::error::BACKTEST_REPLICA_TIMEOUT_SECONDS must be an integer between 60 and 86400"
            exit 1
          fi

      - name: Sign in to Azure with OIDC
        uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate and deploy digest-pinned infrastructure
        shell: bash
        env:
          DEPLOYMENT_NAME: fca-${{ github.run_id }}-${{ github.run_attempt }}
          BUDGET_ALERT_CONTACT_EMAIL: ${{ secrets.BUDGET_ALERT_CONTACT_EMAIL }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          acr_name="$(az acr list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[?tags.product=='market-lake' && tags.environment=='${DEPLOYMENT_ENVIRONMENT}'].name | [0]" \
            --output tsv)"
          if [[ -z "$acr_name" ]]; then
            echo "::error::The private runtime ACR is missing; rerun the authorized OIDC bootstrap"
            exit 1
          fi

          mirror_repository="${GITHUB_REPOSITORY_NAME,,}"
          ghcr_source="${GITHUB_OWNER,,}/${GITHUB_REPOSITORY_NAME,,}@${IMAGE_DIGEST}"
          az acr import \
            --name "$acr_name" \
            --source "ghcr.io/${ghcr_source}" \
            --username "$GITHUB_ACTOR" \
            --password "$GHCR_TOKEN" \
            --image "${mirror_repository}:${GITHUB_SHA}" \
            --force \
            --only-show-errors \
            --output none

          mirrored_digest="$(az acr repository show \
            --name "$acr_name" \
            --image "${mirror_repository}:${GITHUB_SHA}" \
            --query digest \
            --output tsv)"
          if [[ "$mirrored_digest" != "$IMAGE_DIGEST" ]]; then
            echo "::error::The private ACR import changed the published image digest"
            exit 1
          fi
          acr_login_server="$(az acr show \
            --name "$acr_name" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query loginServer \
            --output tsv)"
          runtime_image_reference="${acr_login_server}/${mirror_repository}@${IMAGE_DIGEST}"

          deployment_parameters=(
            "location=$AZURE_LOCATION"
            "resourceNamePrefix=$RESOURCE_NAME_PREFIX"
            "environmentName=$DEPLOYMENT_ENVIRONMENT"
            "sharedImageReference=$runtime_image_reference"
            "githubOwner=$GITHUB_OWNER"
            "githubOwnerId=$GITHUB_OWNER_ID"
            "githubRepository=$GITHUB_REPOSITORY_NAME"
            "githubRepositoryId=$GITHUB_REPOSITORY_ID"
            "githubEnvironment=$DEPLOYMENT_ENVIRONMENT"
            "budgetStartDate=$BUDGET_START_DATE"
            "budgetAlertContactEmail=$BUDGET_ALERT_CONTACT_EMAIL"
            "assignGithubDeployerRoles=false"
            "allowPublicNetworkAccess=$ALLOW_PUBLIC_NETWORK_ACCESS"
            "enableExternalApiIngress=$ENABLE_EXTERNAL_API_INGRESS"
            "ingestCronExpression=$INGEST_CRON_EXPRESSION"
            "ingestReplicaTimeoutSeconds=$INGEST_REPLICA_TIMEOUT_SECONDS"
            "enableCryptoTrader=$ENABLE_CRYPTO_TRADER"
            "rthTraderMode=$RTH_TRADER_CREDENTIAL_MODE"
            "cryptoTraderMode=$CRYPTO_TRADER_CREDENTIAL_MODE"
            "rthScheduleTimezone=$RTH_SCHEDULE_TIMEZONE"
            "rthScheduleStart=$RTH_SCHEDULE_START"
            "rthScheduleEnd=$RTH_SCHEDULE_END"
            "rthTraderReplicas=$RTH_TRADER_REPLICAS"
            "backtestReplicaTimeoutSeconds=$BACKTEST_REPLICA_TIMEOUT_SECONDS"
            # Optional and non-secret; empty keeps the API on static bearer auth.
            "lakeApiAudience=$LAKE_API_AUDIENCE"
          )

          az deployment group validate \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters "${deployment_parameters[@]}" \
            --only-show-errors \
            --output none

          az deployment group create \
            --name "$DEPLOYMENT_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters "${deployment_parameters[@]}" \
            --only-show-errors \
            --output none

      - name: Verify workload image digests
        id: runtime
        shell: bash
        run: |
          set -euo pipefail

          normalized_prefix="${RESOURCE_NAME_PREFIX,,}"
          normalized_environment="${DEPLOYMENT_ENVIRONMENT,,}"
          api_app_name="${normalized_prefix}-${normalized_environment}-api"
          ingest_job_name="${normalized_prefix}-${normalized_environment}-ingest"
          quant_api_app_name="${normalized_prefix}-${normalized_environment}-quant-api"
          rth_trader_app_name="${normalized_prefix}-${normalized_environment}-rth-trader"
          crypto_trader_app_name="${normalized_prefix}-${normalized_environment}-crypto-trader"
          backtest_job_name="${normalized_prefix}-${normalized_environment}-backtest"
          acr_login_server="$(az acr list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[?tags.product=='market-lake' && tags.environment=='${DEPLOYMENT_ENVIRONMENT}'].loginServer | [0]" \
            --output tsv)"
          expected_runtime_image="${acr_login_server}/${GITHUB_REPOSITORY_NAME,,}@${IMAGE_DIGEST}"

          api_image="$(az containerapp show \
            --name "$api_app_name" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.template.containers[?name=='api'].image | [0]" \
            --output tsv)"
          ingest_image="$(az containerapp job show \
            --name "$ingest_job_name" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.template.containers[?name=='ingest'].image | [0]" \
            --output tsv)"

          if [[ "$api_image" != "$expected_runtime_image" ]]; then
            echo "::error::The API does not use the published immutable image reference"
            exit 1
          fi
          if [[ "$ingest_image" != "$expected_runtime_image" ]]; then
            echo "::error::The ingest job does not use the published immutable image reference"
            exit 1
          fi

          quant_api_image="$(az containerapp show \
            --name "$quant_api_app_name" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.template.containers[?name=='api'].image | [0]" \
            --output tsv)"
          if [[ "$quant_api_image" != "$expected_runtime_image" ]]; then
            echo "::error::The quant API does not use the published immutable image reference"
            exit 1
          fi

          rth_trader_image="$(az containerapp show \
            --name "$rth_trader_app_name" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.template.containers[?name=='trader'].image | [0]" \
            --output tsv)"
          if [[ "$rth_trader_image" != "$expected_runtime_image" ]]; then
            echo "::error::The RTH trader does not use the published immutable image reference"
            exit 1
          fi

          backtest_image="$(az containerapp job show \
            --name "$backtest_job_name" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.template.containers[?name=='backtest'].image | [0]" \
            --output tsv)"
          if [[ "$backtest_image" != "$expected_runtime_image" ]]; then
            echo "::error::The backtest job does not use the published immutable image reference"
            exit 1
          fi

          if [[ "${ENABLE_CRYPTO_TRADER,,}" == "true" ]]; then
            crypto_trader_image="$(az containerapp show \
              --name "$crypto_trader_app_name" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "properties.template.containers[?name=='trader'].image | [0]" \
              --output tsv)"
            if [[ "$crypto_trader_image" != "$expected_runtime_image" ]]; then
              echo "::error::The crypto trader does not use the published immutable image reference"
              exit 1
            fi
          fi

          api_fqdn="$(az containerapp show \
            --name "$api_app_name" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"
          if [[ -z "$api_fqdn" || "$api_fqdn" == "None" ]]; then
            echo "::error::The deployed API did not expose an ingress FQDN for the health smoke"
            exit 1
          fi

          api_url="https://${api_fqdn}/health"
          printf 'api-url=%s\n' "$api_url" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployment"
            echo "- Environment: \\`$DEPLOYMENT_ENVIRONMENT\\`"
            echo "- Image digest: \\`$IMAGE_DIGEST\\`"
            echo "- API health endpoint: \\`$api_url\\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run probe-safe health smoke
        shell: bash
        env:
          API_HEALTH_URL: ${{ steps.runtime.outputs.api-url }}
        run: |
          set -euo pipefail

          if [[ "${ENABLE_EXTERNAL_API_INGRESS,,}" == "true" ]]; then
            response="$(curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 12 \
              --retry-all-errors \
              --retry-delay 5 \
              --connect-timeout 10 \
              --max-time 30 \
              "$API_HEALTH_URL")"
            if ! printf '%s' "$response" | jq --exit-status --arg expected ok '.status == $expected' >/dev/null; then
              echo "::error::The probe-safe health endpoint did not return status ok"
              exit 1
            fi
          else
            normalized_prefix="${RESOURCE_NAME_PREFIX,,}"
            normalized_environment="${DEPLOYMENT_ENVIRONMENT,,}"
            api_app_name="${normalized_prefix}-${normalized_environment}-api"

            restore_scale_to_zero() {
              az containerapp update \
                --name "$api_app_name" \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --min-replicas 0 \
                --only-show-errors \
                --output none
            }
            trap restore_scale_to_zero EXIT

            az containerapp update \
              --name "$api_app_name" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --min-replicas 1 \
              --only-show-errors \
              --output none

            probes="$(az containerapp show \
              --name "$api_app_name" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "properties.template.containers[?name=='api'] | [0].probes" \
              --output json)"
            if ! jq --exit-status \
              'length == 3 and all(.[]; .httpGet.path == "/health" and .httpGet.port == 8000)' \
              <<<"$probes" >/dev/null; then
              echo "::error::The private API revision is not configured to probe /health"
              exit 1
            fi

            health_state="Unknown"
            provisioning_state="Unknown"
            for _ in {1..24}; do
              revision="$(az containerapp revision list \
                --name "$api_app_name" \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --output json \
                | jq --compact-output \
                  '[.[] | select(.properties.active == true)] | sort_by(.properties.createdTime) | last // {}')"
              health_state="$(jq --raw-output '.properties.healthState // "Unknown"' <<<"$revision")"
              provisioning_state="$(jq --raw-output '.properties.provisioningState // "Unknown"' <<<"$revision")"
              if [[ "$health_state" == "Healthy" && "$provisioning_state" == "Provisioned" ]]; then
                break
              fi
              if [[ "$health_state" == "Unhealthy" || "$provisioning_state" == "Failed" ]]; then
                echo "::error::The private API revision failed its /health probes ($health_state, $provisioning_state)"
                exit 1
              fi
              sleep 5
            done
            if [[ "$health_state" != "Healthy" || "$provisioning_state" != "Provisioned" ]]; then
              echo "::error::The private API revision did not pass /health probes before the smoke deadline ($health_state, $provisioning_state)"
              exit 1
            fi

            restore_scale_to_zero
            trap - EXIT
          fi

  quant-smoke:
    name: Quant runtime smoke test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs:
      - publish-image
      - deploy
    uses: ./.github/workflows/quant-smoke.yml
    permissions:
      contents: read
      id-token: write
    with:
      # Quant runtime workloads (quant API, RTH trader, optional crypto
      # trader, backtest job) deploy the same shared digest-pinned image as
      # the lake; this pins their smoke verification to the exact published
      # digest. See .github/runbooks/h5-quant-smoke.md.
      image-digest: ${{ needs.publish-image.outputs.image-digest }}

  acr-retention:
    name: ACR image retention
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs:
      - publish-image
      - deploy
    uses: ./.github/workflows/prune-acr.yml
    permissions:
      contents: read
      id-token: write
    with:
      # The prune keeps the newest and previous mirrored digest per service and
      # treats the just-deployed digest as retained regardless of survey
      # ordering. See .github/runbooks/e1-ghcr-retention.md.
      image-digest: ${{ needs.publish-image.outputs.image-digest }}
