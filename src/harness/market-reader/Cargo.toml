[package]
name = "harness-market-reader"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Read-only market-data snapshots, verified Parquet reads, and bounded partition reuse."

[dependencies]
lake-contracts = { path = "../../lake/contracts" }
arrow-array = "59"
bytes = "1"
futures-util = "0.3"
hex = "0.4"
parquet = { version = "59", features = ["arrow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "fs"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
