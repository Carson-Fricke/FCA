[package]
name = "harness-execution"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
harness-contracts = { path = "../contracts" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
