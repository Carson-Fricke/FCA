[package]
name = "harness-host"
version = "0.1.0"
edition = "2021"
description = "Embedded Python host for user strategies, indicators, and screeners."
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
harness-backtest = { path = "../harness-backtest" }
harness-num = { path = "../harness-num" }
pyo3 = { version = "0.29", features = ["auto-initialize"] }
rustpython-ast = { version = "0.4", features = ["visitor"] }
rustpython-parser = "0.4"
serde_json = "1"
