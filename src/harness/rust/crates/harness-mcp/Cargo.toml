[package]
name = "harness-mcp"
version = "0.1.0"
edition = "2021"
description = "JSON-RPC 2.0 / MCP server for the quant-harness Rust port."
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
