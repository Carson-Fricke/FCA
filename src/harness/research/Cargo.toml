[package]
name = "harness-research"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
config = { path = "../config" }
marketdata = { path = "../marketdata" }
harness-strategy-jit = { path = "../strategy-jit" }
harness-strategy-sdk = { path = "../strategy-sdk" }
harness-contracts = { path = "../contracts" }
harness-trading = { path = "../trading" }
harness-lakeclient = { path = "../lakeclient" }
backtest = { path = "../backtest" }
arrow-array = "59"
chrono = { version = "0.4", features = ["serde"] }
num = { path = "../num" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tempfile = "3"

[dev-dependencies]
parquet = { version = "59", features = ["arrow"] }
harness-lakeclient = { path = "../lakeclient", features = ["test-support"] }
marketdata = { path = "../marketdata" }
