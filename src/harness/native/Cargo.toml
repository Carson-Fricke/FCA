[package]
name = "native"
version = "0.1.0"
edition = "2021"
description = "C ABI native core for the quant-harness Rust engine (staged port)."
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# arrow-rs is used only for the Arrow C Data Interface (`arrow::ffi`): the
# crate itself is pulled in with `default-features = false` so the native core
# stays free of the CSV/IPC/JSON stacks. The batch producer is expressed with
# `ArrowArray`/`ArrowSchema` rather than a hand-rolled ABI struct.
arrow = { version = "59.3", default-features = false, features = ["ffi"] }
arrow-array = { version = "59.3", features = ["ffi"] }
arrow-schema = { version = "59.3", features = ["ffi"] }

[dev-dependencies]
num = { path = "../num" }
