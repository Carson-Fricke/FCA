[package]
name = "live"
version = "0.1.0"
edition = "2021"
description = "Deterministic live-trading core (OMS, fills, venues, portfolio, risk) for the quant-harness Rust engine (staged port)."
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["rlib"]

[[bin]]
name = "trader"
path = "src/bin/trader.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
num = { path = "../num" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2"] }
serde_json = "1.0.151"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "sync", "net"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "net"] }

[features]
