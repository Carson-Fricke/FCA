[package]
name = "config"
version = "0.1.0"
edition = "2021"
description = "Behavior-identical harness configuration loader, models, and hashing."
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
harness-contracts = { path = "../contracts" }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = "1"
serde_json = "1"
