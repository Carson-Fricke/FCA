[package]
name = "harness-strategy-jit"
version = "0.1.0"
edition = "2021"
description = "JIT compile and load seam for harness-strategy-sdk authored programs."
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
harness-trading = { path = "../trading" }
harness-contracts = { path = "../contracts" }
harness-strategy-sdk = { path = "../strategy-sdk" }
num = { path = "../num" }
libloading = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
harness-lakeclient = { path = "../lakeclient", features = ["test-support"] }
marketdata = { path = "../marketdata" }

[build-dependencies]
sha2 = "0.10"
