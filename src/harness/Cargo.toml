# Quant-harness Rust workspace.
#
# Every crate is a direct child of this directory. This manifest is the Cargo root.
[workspace]
resolver = "2"
members = [
    "num",
    "api",
    "marketdata",
    "backtest",
    "live",
    "mcp",
    "config",
    "contracts",
    "strategy-sdk",
    "strategy-jit",
    "lakeclient",
]

# Keep build trees small. On Windows/MSVC every linked binary emits a full PDB
# when debug info is on, and the test suite links many executables; debug info
# stays off for all profiles and incremental caches are disabled.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
debug = 0
incremental = false
