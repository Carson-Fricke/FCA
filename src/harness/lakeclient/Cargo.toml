[package]
name = "harness-lakeclient"
version = "0.1.0"
edition = "2021"
description = "Async market-lake HTTP client for the quant-harness: ensure, coverage, jobs, Arrow reads, and reference views."
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["rlib"]

[features]
test-support = ["dep:axum", "dep:arrow-schema", "dep:parquet", "dep:lake-contracts", "dep:sha2", "dep:hex"]

[dependencies]
async-trait = "0.1"
harness-contracts = { path = "../contracts" }
harness-market-reader = { path = "../market-reader" }
bytes = "1"
parquet = { version = "59", features=["arrow"], optional=true }
lake-contracts = { path="../../lake/contracts", optional=true }
sha2 = { version="0.10", optional=true }
hex = { version="0.4", optional=true }
arrow-array = "59"
arrow-schema = { version = "59", optional = true }
axum = { version = "0.8", optional = true }
futures-util = "0.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "net"] }

[dev-dependencies]
tempfile = "3"
harness-lakeclient = { path = ".", features = ["test-support"] }
serde_json = "1"
