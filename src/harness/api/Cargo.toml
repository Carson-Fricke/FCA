[package]
name = "api"
version = "0.1.0"
edition = "2021"
description = "Clap-based command-line surface and axum HTTP boundary for the quant-harness Rust port."
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["rlib"]

[[bin]]
name = "harness"
path = "src/bin/harness.rs"

[[bin]]
name = "backtest-job"
path = "src/bin/backtest_job.rs"

[[bin]]
name = "screen-job"
path = "src/bin/screen_job.rs"

[[bin]]
name = "api"
path = "src/bin/api.rs"

[[bin]]
name = "mcp"
path = "src/bin/mcp.rs"

[dependencies]
harness-research = { path = "../research" }
harness-trading = { path = "../trading" }
harness-execution-storage = { path = "../execution-storage" }
harness-execution = { path = "../execution" }
futures-util = "0.3"
lake-hosted = { path = "../../lake/hosted" }
lake-contracts = { path = "../../lake/contracts" }
lake-storage = { path = "../../lake/storage" }
azure_core = { version = "0.21", features = ["tokio-fs"] }
azure_identity = "0.21"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
harness-contracts = { path = "../contracts" }
config = { path = "../config" }
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
backtest = { path = "../backtest" }
harness-lakeclient = { path = "../lakeclient" }
harness-strategy-jit = { path = "../strategy-jit" }
live = { path = "../live" }
marketdata = { path = "../marketdata" }
mcp = { path = "../mcp" }
hex = "0.4"
num = { path = "../num" }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "sync"] }
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
harness-lakeclient = { path = "../lakeclient", features = ["test-support"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[[bin]]
name = "market-data-profile"
path = "src/bin/market_data_profile.rs"

[[bin]]
name = "harness-worker"
path = "src/bin/harness_worker.rs"
