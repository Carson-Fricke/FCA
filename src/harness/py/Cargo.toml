[package]
name = "py"
version = "0.1.0"
edition = "2021"
description = "Python bindings for the quant-harness Rust engine (staged port)."
license = "Apache-2.0"
publish = false

[lib]
# The cdylib is renamed to ``harness/_rust.pyd`` by the Python build backend
# (setuptools-rust). The lib name must match the ``#[pymodule]`` function name
# so the exported ``PyInit__rust`` symbol lines up with the import path.
name = "_rust"
crate-type = ["cdylib"]

[features]
default = []
# Enabled by the Python build backend so the cdylib does not link libpython and
# behaves as a true extension module. It is deliberately left off for
# `cargo test`/`cargo check`, where the test harness links the interpreter it
# runs under.
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.29", default-features = false, features = ["macros"] }
