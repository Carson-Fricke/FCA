[package]
name = "backtest"
version = "0.1.0"
edition = "2021"
description = "Backtest, sweeps, and results kernels for the quant-harness Rust engine (staged port)."
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
num = { path = "../num" }
marketdata = { path = "../marketdata" }
arrow-array = "59"
arrow-schema = "59"
parquet = { version = "59", features = ["arrow"] }
serde_json = "1"

[dev-dependencies]
host = { path = "../host" }
