[package]
name = "backtest"
version = "0.1.0"
edition = "2021"
description = "Native backtest execution and results kernels for the quant-harness Rust engine."
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
config = { path = "../config" }
harness-contracts = { path = "../contracts" }
num = { path = "../num" }
marketdata = { path = "../marketdata" }
harness-lakeclient = { path = "../lakeclient" }
arrow-array = "59"
arrow-schema = "59"
parquet = { version = "59", features = ["arrow"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
zstd = "0.13"

[dev-dependencies]
harness-lakeclient = { path = "../lakeclient", features = ["test-support"] }
