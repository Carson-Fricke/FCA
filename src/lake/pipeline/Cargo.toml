[package]
name = "lake-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Shared ingestion resource admission, cancellation, and stage measurements."
[dependencies]
lake-contracts.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Foundation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
