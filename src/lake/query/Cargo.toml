[package]
name = "lake-query"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Bounded file queries over ensured lake objects."

[dependencies]
lake-contracts.workspace = true
lake-catalog.workspace = true
lake-coverage.workspace = true
lake-reference.workspace = true
lake-storage.workspace = true
duckdb = { version = "1.10505.0", features = ["bundled"] }
# Same major as duckdb's bundled re-export; the `ipc` feature unifies onto
# `duckdb::arrow` so the arrow-stream response can be written directly.
arrow = { version = "58", default-features = false, features = ["ipc"] }
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio.workspace = true
tempfile.workspace = true
