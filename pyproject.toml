[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fca"
version = "0.1.0"
description = "Financial data and quantitative trading platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "azure-data-tables>=12.5",
    "azure-identity>=1.17",
    "azure-storage-blob>=12.22",
    "azure-storage-queue>=12.12",
    "duckdb>=1.1",
    "exchange-calendars>=4.5",
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=2.0",
    "orjson>=3.10",
    "pyarrow>=17",
    "pydantic-settings>=2.5",
    "pyjwt[crypto]>=2.9",
    "tenacity>=9.0",
    "typer>=0.16",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "ty>=0.0.77",
]

[project.scripts]
lake = "lake.cli:main"
harness = "harness.cli:main"
api = "harness.cli.api:main"
backtest-job = "harness.cli.backtest_job:main"
trader = "harness.cli.trader:main"
thesis = "thesis.cli:main"

[tool.setuptools]
package-dir = { "" = "src", "strategies" = "strategies" }

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["harness*", "lake*", "thesis*", "strategies*"]
namespaces = false

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib", "-ra"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "strategies", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "strategies", "tests"]
