[package]
name = "harness-api"
version = "0.1.0"
edition = "2021"
description = "Clap-based command-line surface for the quant-harness Rust port."
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["rlib"]

[[bin]]
name = "harness"
path = "src/bin/harness.rs"

[[bin]]
name = "backtest-job"
path = "src/bin/backtest_job.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
