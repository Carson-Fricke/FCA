[package]
name = "harness-host"
version = "0.1.0"
edition = "2021"
description = "Embedded Python host for user strategies, indicators, and screeners."
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["rlib"]

[features]
default = ["pyo3-bridge"]
# Expose the PyO3-backed strategy context and binding bridge. Disable to build
# only the native contract, linter, and reference surfaces.
pyo3-bridge = []

[dependencies]
pyo3 = { version = "0.29", features = ["auto-initialize"] }
rustpython-ast = { version = "0.4", features = ["visitor"] }
rustpython-parser = "0.4"
serde_json = "1"
