# Quant-harness Rust workspace.
#
# The Python engine under `src/harness` and the pinned Zig native core under
# `src/harness/native` remain authoritative until the migration flips. These
# crates are the staged home for the Rust port; member names are declared up
# front so later work can fill them in with disjoint file ownership.
[workspace]
resolver = "2"
members = [
    "crates/harness-native",
    "crates/harness-py",
    "crates/harness-num",
    "crates/harness-api",
    "crates/harness-live",
]
